# Structured routing defaults for the toolkit orchestrator.
#
# This is a toolkit convention, not an official Copilot CLI config file.
# Official custom-agent definitions still live in agents/*.agent.md. The
# built-in Task tool route below is a routing default only; it does not add
# a custom agent definition. This file exists so the orchestrator can pass
# hard task-call parameters (model, reasoning_effort, context_tier) instead
# of relying only on Markdown guidance.
#
# Keep this file in sync with:
# - agents/*.agent.md frontmatter
# - instructions/copilot-instructions.md
# - README.md's "Agent pipeline" section
# - tests/test_agent_pipeline.py EXPECTED_AGENTS / EXPECTED_ROUTING
agents:
  # Keep this inventory to the seven toolkit-owned agents. Built-in CLI
  # routes belong in built_in_tools below, not in agents/*.agent.md.
  discovery:
    role: Codebase Mapping Specialist
    copilot: { model: gemini-3.8-flash, reasoning_effort: low, context_tier: long_context }
  planner:
    role: Implementation Planner
    copilot: { model: gpt-6.1-sol, reasoning_effort: medium, context_tier: long_context }
  coder:
    role: Routine Implementation Engineer
    copilot: { model: gpt-6-luna, reasoning_effort: xhigh, context_tier: default }
  senior-coder:
    role: Senior Software Engineer / Architect
    copilot: { model: claude-opus-5.5, reasoning_effort: high, context_tier: long_context }
  reviewer:
    role: Code Review Specialist
    copilot: { model: claude-opus-5.5, reasoning_effort: high, context_tier: long_context }
  tester:
    role: Test Engineer
    copilot: { model: gpt-6-luna, reasoning_effort: xhigh, context_tier: default }
  test-reviewer:
    role: Test Coverage Reviewer
    copilot: { model: claude-opus-5.5, reasoning_effort: high, context_tier: long_context }

built_in_tools:
  task:
    role: Mechanical Shell Task Executor
    copilot: { model: gpt-6-luna, reasoning_effort: low, context_tier: default }

# Small/casual implementation requests must be delegated through the task
# tool to the named custom agent; this is distinct from built-in task above.
task_routing:
  small_casual_implementation:
    agent: coder
    model: gpt-6-luna
    reasoning_effort: low
    context_tier: default
