# Structured routing defaults for the toolkit orchestrator.
#
# This is a toolkit convention, not an official Copilot CLI config file.
# Official custom-agent definitions still live in agents/*.agent.md. The
# built-in Task tool route below is a routing default only; it does not add
# a custom agent definition. This file exists so the orchestrator can pass
# hard task-call parameters (model, reasoning_effort, context_tier) instead
# of relying only on Markdown guidance.
#
# Keep this file in sync with:
# - agents/*.agent.md frontmatter
# - instructions/copilot-instructions.md
# - README.md's "Agent pipeline" section
# - tests/test_agent_pipeline.py EXPECTED_AGENTS / EXPECTED_ROUTING
#
# These are the shipped defaults only. copilot-s menu `p`
# (bin/copilot-model-refresh.py) never edits this file: confirmed local
# overrides live under <COPILOT_HOME>/model-refresh/ plus a generated
# personal instruction, and are resolved on top of these defaults.
agents:
  # Keep this inventory to the seven toolkit-owned agents. Built-in CLI
  # routes belong in built_in_tools below, not in agents/*.agent.md.
  discovery:
    role: Codebase Mapping Specialist
    copilot: { model: gpt-6-luna, reasoning_effort: low, context_tier: long_context }
  planner:
    role: Implementation Planner
    copilot: { model: gpt-6.1-sol, reasoning_effort: medium, context_tier: long_context }
  coder:
    role: Routine Implementation Engineer
    copilot: { model: gpt-6.1-sol, reasoning_effort: medium, context_tier: default }
  senior-coder:
    role: Senior Software Engineer / Architect
    copilot: { model: claude-opus-5.5, reasoning_effort: high, context_tier: long_context }
  reviewer:
    role: Code Review Specialist
    copilot: { model: claude-sonnet-5.5, reasoning_effort: high, context_tier: long_context }
  tester:
    role: Test Engineer
    copilot: { model: gpt-6.1-sol, reasoning_effort: xhigh, context_tier: default }
  test-reviewer:
    role: Test Coverage Reviewer
    copilot: { model: claude-sonnet-5.5, reasoning_effort: high, context_tier: long_context }

built_in_tools:
  task:
    role: Mechanical Shell Task Executor
    copilot: { model: gpt-6-luna, reasoning_effort: low, context_tier: default }

# Small/casual implementation requests must be delegated through the task
# tool to the named custom agent; this is distinct from built-in task above.
task_routing:
  small_casual_implementation:
    agent: coder
    model: gpt-6.1-terra
    reasoning_effort: low
    context_tier: default
  code_review:
    # Toolkit orchestration convention; not native Copilot CLI routing config.
    required_after_every_code_change: true
    exempt_change_types: [pure_prose_docs, mechanical_git_only]
    default:
      agent: reviewer
      model: claude-sonnet-5.5
      reasoning_effort: high
      context_tier: long_context
    stronger_override:
      when: [senior_coder_authored, complex_or_high_risk, implementation_model_unknown]
      agent: reviewer
      model: claude-opus-5.5
      reasoning_effort: high
      context_tier: long_context
    review_budget: one_comprehensive_pass_plus_up_to_3_focused_verification_rounds
    broad_review_timing: after_complete_code_and_test_batch
    review_record_command: copilot-task-report.py record-review
  orchestration_policy:
    # Toolkit orchestration convention; not native Copilot CLI routing config.
    # Policy only: it changes no model, reasoning_effort or context_tier value.
    main_session_direct: [simple_questions, single_continuous_investigation, genuinely_trivial_edits_when_handoff_costs_more]
    delegate_when: [substantial_separate_context, demonstrable_net_cost_benefit]
    delegate_tiny_commands_by_default: false
    trivial_main_session_edits_still_reviewed: true
    handoff_granularity: one_complete_bounded_batch_per_implementer
    test_before_single_broad_review: true
    parallel_only_for: independent_reads_or_non_overlapping_writes
    finding_triage: fix_significant_defer_optional_polish
    budget_exhaustion: single_actionable_escalation_then_wait
    budget_extension_requires: explicit_user_authorization
    automatic_new_cycle_on_exhaustion: false
    delivery_metrics: [completion, cost, elapsed_time, confirmed_material_defects_and_regressions]
    delivery_tracking_scope: meaningful_multi_agent_features_only
    delivery_record_commands: [copilot-task-report.py record-delivery, copilot-task-report.py feature-calls, copilot-task-report.py record-feature-usage]

# User approval is required before substantive work on these routes.
# This is an orchestrator convention, not a Copilot CLI enforcement feature.
routing_approval:
  required_tiers: [standard, complex, high-risk]
  required_for_broad_discovery_or_design_planning: true
  allowed_preapproval_work: minimal_reads_for_classification
  prompt_choices: [approve_recommended_delegation, main_session_alternative, custom_routing]
  approval_authorizes: routing_only
  require_renewed_approval_for_significant_route_changes: true
  cancellation_or_decline: stop_without_substantive_work
  if_ask_user_unavailable: pause_and_request_plain_text_approval_if_runtime_supports
